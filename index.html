<!DOCTYPE html>
<html>
<head>
    <title>Smart Chatbot</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .chatbox{
            background:white;
            padding:30px;
            width:400px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
            text-align:center;
        }
        h2{
            color:#4CAF50;
        }
        input{
            width:90%;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            margin-top:10px;
        }
        button{
            margin-top:15px;
            padding:10px 20px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        button:hover{
            background:#45a049;
        }
        .reply{
            margin-top:20px;
            font-size:18px;
            color:#333;
        }
    </style>
</head>
<body>
<div class="chatbox">
    <h2>🤖 Smart Chatbot</h2>
    <form method="POST">
        <input type="text" name="message" placeholder="Type your message..." required>
        <br>
        <button type="submit">Send</button>
    </form>
    {% if response %}
        <div class="reply">
            <b>Bot:</b> {{ response }}
        </div>
    {% endif %}
</div>
</body>
</html>
